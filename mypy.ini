[mypy]
python_version = 3.13
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true

# Disable union-attr errors (common in dict.get() patterns)
disable_error_code = union-attr, no-any-return

# Disable strict checks for third-party libs
[mypy-gspread.*]
ignore_missing_imports = true
ignore_errors = true

[mypy-langgraph.*]
ignore_missing_imports = true

[mypy-apify_client.*]
ignore_missing_imports = true
