# Generic Configuration File

user_profile:
  name: "Your Full Name"
  email: "your.email@example.com"
  phone: "+XX XXX XXX XXXX"
  linkedin: "linkedin.com/in/your-profile"
  github: "github.com/your-username"
  kaggle: "kaggle.com/your-username"

  background:
    summary: "Professional summary highlighting your expertise, experience, and specializations in your field."
    skills:
      - "Skill1"
      - "Skill2"
      - "Skill3"
      - "Skill4"
      - "Skill5"
      - "Skill6"
      - "Tool1"
      - "Tool2"
    experience_years: 0

  target_criteria:
    desired_roles:
      - "Job Title 1"
      - "Job Title 2"
      - "Job Title 3"
      - "Job Title 4"
    desired_industries:
      - "Industry1"
      - "Industry2"
      - "Industry3"
      - "Industry4"
    minimum_salary: 0 # Adjust based on position level
    preferred_locations:
      - "Country"
      - "Remote"
      - "City1"
      - "City2"
    deal_breakers:
      - "Your deal breaker criteria"

job_search:
  keywords: "your job search keywords"
  location: "your location"
  experience_level: "entry_level" # "internship", "entry_level", "mid_level", "senior_level"
  date_posted: "week" # "day", "week", "month"
  max_jobs_per_run: 50
  relevance_threshold: 7 # Minimum score to proceed (0-10)
  use_cached_dataset: true # true = use existing dataset, false = run fresh actor search

resume_template:
  base_latex_file: "templates/base_resume.tex"
  style: "modern"

cover_letter:
  enabled: true
  base_latex_file: "templates/cover_letter_boilerplate.tex"

llm_settings:
  model: "provider/model-name" # LLM provider model identifier
  max_tokens: 4096
  temperature: 0.3

schedule:
  enabled: false
  interval: "daily" # "hourly", "daily", "weekly"
  time: "09:00" # For daily/weekly schedules
